name: my_day_phone
description: "MyDay 手机版：课表、天气、备忘录，数据只存在本机。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# 1.6.1：需求文档第 2 条（导入课表）的落地方式调整 —— 原本想做的「相册选课表
# 截图 OCR 识别」经验证做不通（教务系统的彩色课块没有边界，OCR 认不准，
# 详见 DEV-PLAN.md「已否决的方案」），改成把现有的 xlsx / PDF 导入入口做清楚：
# 按钮改名「导入课表」，点之前先说明能导什么、去哪拿，并明确劝退截图。
# 修 bug/小改进 → 修订位 +1，构建号 +1（上一个安装包是 1.6.0+24）。
# 1.7.0：需求文档第 3 条 —— 记账模块。手机版独有（电脑版没有），数据单独
# 存 ledger.json，不进与电脑版对齐的四份文件里；备份 zip 里会带上它，
# 电脑版还原时会忽略（不影响它自己），手机版还原电脑版备份时也不冲掉账本。
# 加功能 → 次位 +1、修订位清 0，构建号 +1（上一个安装包是 1.6.1+25）。
# 1.7.1：换应用图标 —— 用凯森给的 Cloud logo（白线条倒三角，深灰底），
# 由 tools/make_app_icon.py + tools/make_adaptive_icon.py 从原图生成。
# 换图标属于小改进 → 修订位 +1，构建号 +1（上一个安装包是 1.7.0+26）。
# 1.7.2：修 bug —— 记账的「记一笔 / 改一笔」页是独立路由，漏垫 GlassBackdrop，
# 进页面整屏变黑（凯森 2026-09-20 反馈）。同 v1.1.0 备忘录编辑页的坑。
# 顺带把背景守卫测试从 2 例扩到 7 例，覆盖所有独立整页 + 源码兜底扫描。
# 修 bug → 修订位 +1，构建号 +1（上一个安装包是 1.7.1+27）。
# 1.7.3：修 bug —— 备份位置设不了，报 Operation not permitted（凯森 2026-09-20
# 反馈）。根因是安卓 10+ 分区存储，要 MANAGE_EXTERNAL_STORAGE「所有文件访问」
# 权限才能写共享目录。加了权限查询/申请（MainActivity + system_tweaks.dart）、
# 选目录前先弹引导框、路径中英文叠层收窄。
# 修 bug → 修订位 +1，构建号 +1（上一个安装包是 1.7.2+28）。
# 1.7.4：修 bug —— 到时间不弹课程提醒通知（凯森 2026-09-20 反馈）。
# 三个原因：① 通知权限被拒后系统静默丢通知、App 侧无感；② 用的是非精确闹钟，
# 安卓会攒着延后触发；③ 重排是「先全撤后重排」，中途失败会导致通知全没。
# 对应改动：设置页加通知权限/精确闹钟状态显示与一键跳转；排通知优先用
# exactAllowWhileIdle（拿不到权限才降级）；重排改成「先算好再动旧的」。
# 修 bug → 修订位 +1，构建号 +1（上一个安装包是 1.7.3+29）。
# 1.7.5：**找到真凶** —— 凯森说 1.7.4 装完「课表提醒和备忘录定时都没有通知」。
# 根因是 AndroidManifest 里漏声明了插件要求的两个 receiver：
# ScheduledNotificationReceiver（到点收广播 → 弹通知）和
# ScheduledNotificationBootReceiver（开机恢复）。插件自带的清单里**没有**这两个，
# 必须 App 自己声明。漏了的话闹钟照样响、广播照样发，但**没人接**，
# 通知永远不出现且毫无报错 —— 从 v1.6.0 加通知功能起就没真正跑通过。
# 另外加了「已排提醒」自检（问系统实际排了几条）和打包守卫测试。
# 修 bug → 修订位 +1，构建号 +1（上一个安装包是 1.7.4+30）。
# 1.7.6：继续修 —— 凯森说 1.7.5 装完「到点没弹通知并且闪退」。两个原因：
# ① 通知小图标用的是彩色 @mipmap/ic_launcher，安卓通知栏要求纯白剪影，
#    部分国产 ROM 会在弹通知时因图标不合规崩进程 → 换成专门的
#    drawable/ic_notification.png（tools/make_notification_icon.py 生成）；
# ② 开机的 BootReceiver 拉的是**无界面引擎**，而 init() 里会申请通知权限 ——
#    没有 Activity 时申请权限会崩 → 加 initHeadless()，开机重排不申请权限。
# 另外给重排加了防重入（启动/改设置/改课表可能同时触发）。
#
# v1.7.6 补记（连上真机后）：上面那些都不是主因。真机崩溃记录显示
#   receiver 一启动就抛 Missing type parameter —— R8 把 Gson 需要的
#   泛型签名擦掉了。加了 android/app/proguard-rules.pro 才真修好。
#
# 修 bug → 修订位 +1，构建号 +1（上一个安装包是 1.7.5+31）。
# 构建号 +33 = 第 1 次出 1.7.6 的包；
# 构建号 +34 = 按凯森要求去掉「测试通知」按钮后重新出的包（调试用的东西不留在界面上）。
#
# 加功能 → 次位 +1 且修订位清 0（凯森 2026-09-19 定的规矩）。
# 1.8.0 = 设置里加「自启动」一键跳转；APK 文件名改为 CloudLife-版本.apk。
# 1.9.0 = 定时提醒改成「只选时间 + 单次/每天/N 天后」+ 首页速览内容默认收起
#         + 去掉备忘录标签 + 修「别处改了数据首页不刷新」
#         （凯森 2026-09-21 的几轮要求）。
#         这几件是**同一个还没发布的版本**，所以只用一个版本号 —— 他明确要求
#         「没确定提交前的所有内容都为同一次提交的内容和版本」。
# 构建号 +37/+38/+39 是过程中的包，+40 是去掉标签后的包。
#
# 2.1.1 = 整体换肤：Liquid Glass → v2.0 设计系统
#   （靛蓝主色 + 强调橙 + 字阶收敛 + 首页/功能/课程/天气/设置逐页重排）。
#   版本名 2026-09-22 凯森定的；构建号照旧每出一个包 +1（+47 及之前都是 1.9.0 的包）。
# 构建号 +43 = 试过「课表固定左列」的那一版；凯森 2026-09-22 让回退到上一版，
#   所以 +44 的代码与 +42 相同（课表恢复整体平移 + 双指缩放），只是又一个包。
#   +45 = 按他后续要求，把课块色条和主卡入场动效单独加回来（固定左列仍不做）。
#   +46 = 首页天气小卡去掉湿度（凯森 2026-09-22）。
#   +47 = 天气 / 备忘两张小卡等宽等高（凯森 2026-09-22）。
#   +48 = 2.1.1 的第一个包。
#   +49 = 天气小卡大温度下面加今天最低 / 最高。
#   +50 = 设置 → 关于加「检查更新」（GitHub Releases + 弹窗 + 去下载）。
version: 2.1.1+50

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # 界面中文化（v1.6.0，需求文档第 4 条）：日期选择器的 Cancel/OK/S M T W T F S
  # 这些内置英文都靠它翻成中文
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^8.0.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # 拼路径、取应用私有目录（数据存在手机本机，不上云）
  path: ^1.9.0
  path_provider: ^2.1.4

  # 备份 zip 的打包与解析（M7）：和电脑版 backup.py 用同一种结构；
  # 也用来解 xlsx（M8，xlsx 本身就是 zip）
  archive: ^3.6.1

  # xlsx 里的工作表 XML（M8）
  xml: ^6.5.0

  # 从备份还原时选 zip 文件（M7）；测试里不碰它，靠注入假选择器
  file_picker: ^8.1.2
  geolocator: ^14.0.2
  syncfusion_flutter_pdf: ^33.2.13
  # 备忘录定时提醒（v1.5.0）
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

